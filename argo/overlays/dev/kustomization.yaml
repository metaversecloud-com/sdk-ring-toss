apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../services/ringtoss0
  - ringtoss0-config.yaml
  - ringtoss0-sealedsecret.yaml
  - ringtoss0-httpscaledobject.yaml
  - ringtoss0-interceptor-ingress.yaml
patches:
  # Drop the direct ALB Ingress: dev is fronted through the KEDA interceptor.
  - target:
      kind: Ingress
      name: ringtoss0
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ringtoss0
images:
  - name: ringtoss0
    newName: 368076259134.dkr.ecr.us-east-1.amazonaws.com/sdk-example
    newTag: sdk-ring-toss
